name = "frontend"
version = "1.0.0"
target = "javascript"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
lustre = ">= 5.0.0 and < 6.0.0"
shared = { path = "../shared" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 1.0.0 and < 3.0.0"

[tools.lustre.build]
minify = true
outdir = "../public"

[tools.lustre.dev]
proxy = { from = "/api", to = "http://localhost:8080/api" }

[tools.lustre.html]
lang = "en"
title = "Arda's AI Construct - Ask about Arda Karaduman"
# lustre_dev_tools already writes <meta name="viewport"> itself, so it is not
# repeated here.
meta = [
  { name = "description", content = "An AI chat that answers questions about Arda Karaduman's work, projects and music." },
  { property = "og:type", content = "website" },
  { property = "og:site_name", content = "Arda's AI Construct" },
  { property = "og:url", content = "https://ai.arda.tr/" },
  { property = "og:title", content = "Arda's AI Construct - Ask about Arda Karaduman" },
  { property = "og:description", content = "An AI chat that answers questions about Arda Karaduman's work, projects and music." },
  { property = "og:image", content = "https://ai.arda.tr/og-image.png" },
  { property = "og:image:width", content = "1200" },
  { property = "og:image:height", content = "630" },
  { property = "og:image:type", content = "image/png" },
  { property = "og:image:alt", content = "Arda's AI Construct: an AI assistant that answers questions about Arda." },
  { name = "twitter:card", content = "summary_large_image" },
  { name = "twitter:title", content = "Arda's AI Construct - Ask about Arda Karaduman" },
  { name = "twitter:description", content = "An AI chat that answers questions about Arda Karaduman's work, projects and music." },
  { name = "twitter:image", content = "https://ai.arda.tr/og-image.png" },
]
links = [
  { rel = "canonical", href = "https://ai.arda.tr/" },
  { rel = "icon", type = "image/svg+xml", href = "/favicon.svg" },
]
stylesheets = [
  { href = "https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" },
  { href = "/style.css?v=21" },
]
scripts = [
  # Vendored under public/vendor/ (marked 18.0.5, DOMPurify 3.4.8) — pinned and
  # served same-origin, so there is no CDN supply-chain/availability risk and
  # no need for SRI (which Lustre's html config can't express on scripts anyway).
  { src = "/vendor/marked.min.js" },
  { src = "/vendor/purify.min.js" },
  # Pre-hydration rendition: legacy ids (light/paper/dark/carbon) migrate by
  # role, exactly like `theme_from_string` in frontend.gleam; night is default.
  { content = "document.addEventListener('DOMContentLoaded',function(){var t=null;try{t=localStorage.getItem('theme');}catch(e){}t={light:'xerox',paper:'xerox-hc',dark:'night',carbon:'night-hc'}[t]||t;if(['night','night-hc','xerox','xerox-hc'].indexOf(t)<0)t='night';document.body.setAttribute('data-theme',t);});" },
]
# The CF Web Analytics beacon lives in `body` (raw HTML) because Lustre's
# `scripts` config can't express the required data-cf-beacon attribute.
# The JSON-LD (the site, and the Person that arda.tr defines for the whole
# family) ends `body` too, which the build copies into index.html verbatim.
body = "<div id=\"app\"></div><noscript><p>This chat needs JavaScript. Arda's site is at <a href=\"https://arda.tr\">arda.tr</a>, his résumé at <a href=\"https://resume.arda.tr\">resume.arda.tr</a> and his blog at <a href=\"https://blog.arda.tr\">blog.arda.tr</a>.</p></noscript><!-- Cloudflare Web Analytics --><script defer src=\"https://static.cloudflareinsights.com/beacon.min.js\" data-cf-beacon='{\"token\": \"ec0a808ebf6b4be7b59a63377cbeff3a\"}'></script><!-- End Cloudflare Web Analytics --><script type=\"application/ld+json\">{\"@context\":\"https://schema.org\",\"@type\":\"WebSite\",\"@id\":\"https://ai.arda.tr/#website\",\"url\":\"https://ai.arda.tr/\",\"name\":\"Arda's AI Construct\",\"inLanguage\":[\"en\",\"ja\",\"tr\"],\"about\":{\"@type\":\"Person\",\"@id\":\"https://arda.tr/#person\",\"name\":\"Arda Karaduman\",\"url\":\"https://arda.tr/\"},\"author\":{\"@id\":\"https://arda.tr/#person\"}}</script>"
