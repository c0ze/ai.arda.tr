name = "frontend"
version = "1.0.0"
target = "javascript"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
lustre = ">= 5.0.0 and < 6.0.0"
shared = { path = "../shared" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 1.0.0 and < 3.0.0"

[tools.lustre.build]
minify = true
outdir = "../public"

[tools.lustre.dev]
proxy = { from = "/api", to = "http://localhost:8080/api" }

[tools.lustre.html]
lang = "en"
title = "Arda's AI Construct - Ask about Arda Karaduman"
# lustre_dev_tools already writes <meta name="viewport"> itself, so it is not
# repeated here.
meta = [
  # Dark unless the visitor pins light. The boot script below rewrites this
  # from the stored choice; it must come after this tag.
  { name = "color-scheme", content = "dark" },
  # Soot, the page's ground in the default (dark) scheme.
  { name = "theme-color", content = "#0D0C0A" },
  { name = "description", content = "AI assistant for Arda Karaduman. Answers questions about his work, projects, and music." },
  { property = "og:type", content = "website" },
  { property = "og:site_name", content = "Arda's AI Construct" },
  { property = "og:url", content = "https://ai.arda.tr/" },
  { property = "og:title", content = "Arda's AI Construct - Ask about Arda Karaduman" },
  { property = "og:description", content = "AI assistant for Arda Karaduman. Answers questions about his work, projects, and music." },
  { property = "og:image", content = "https://ai.arda.tr/og-image.png" },
  { property = "og:image:width", content = "1200" },
  { property = "og:image:height", content = "630" },
  { property = "og:image:type", content = "image/png" },
  { property = "og:image:alt", content = "Arda's AI Construct: an AI assistant that answers questions about Arda." },
  { name = "twitter:card", content = "summary_large_image" },
  { name = "twitter:title", content = "Arda's AI Construct - Ask about Arda Karaduman" },
  { name = "twitter:description", content = "AI assistant for Arda Karaduman. Answers questions about his work, projects, and music." },
  { name = "twitter:image", content = "https://ai.arda.tr/og-image.png" },
]
links = [
  { rel = "canonical", href = "https://ai.arda.tr/" },
  { rel = "icon", type = "image/svg+xml", href = "/favicon.svg?v=3" },
  { rel = "preconnect", href = "https://fonts.googleapis.com" },
  { rel = "preconnect", href = "https://fonts.gstatic.com", crossorigin = true },
]
# The family brand, "Kara Duman" (../DESIGN-SYSTEM.md, DESIGN.md). The layer
# order comes first, before any stylesheet. /brand/arda.css (the Astryx `arda`
# theme: every token) and /brand/brand.css (the family patterns) are verbatim
# copies from the arda.tr repository; site styles are in /style.css. Bump a
# file's ?v= when it changes (GitHub Pages caches for ten minutes). The fonts:
# Grenze Gotisch (the wordmark's face; here the h1 only), Spectral (everything
# else), JetBrains Mono (code in replies), Zen Antique (Japanese).
stylesheets = [
  { content = "@layer reset, astryx-base, astryx-theme, brand;" },
  { href = "https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;800;900&family=JetBrains+Mono:wght@400;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=Zen+Antique&display=swap" },
  { href = "/brand/arda.css?v=3" },
  { href = "/brand/brand.css?v=4" },
  { href = "/style.css?v=23" },
]
scripts = [
  # Before first paint: the scheme (the stored pin, else dark; ids stored by the
  # older designs migrate by role) and the theme scope on <html>, which Lustre's
  # html config cannot set. This is scheme.js's own `bootSnippet("theme", "dark")`
  # followed by the data-astryx-theme line; test/page.test.mjs compares it with
  # public/brand/scheme.js, so paste the new output here when that file changes.
  { content = "(function(){var s=null;try{s=localStorage.getItem(\"theme\");if(s!==\"light\"&&s!==\"dark\"){var n=[\"xerox\",\"xerox-hc\",\"stock\",\"stock-hc\",\"alucard\",\"paper\"].indexOf(s)>=0?\"light\":[\"night\",\"night-hc\",\"microfiche\",\"microfiche-hc\",\"dracula\",\"dracula-pro\",\"blade\",\"buffy\",\"lincoln\",\"morbius\",\"van-helsing\",\"carbon\"].indexOf(s)>=0?\"dark\":null;if(s!==null){if(n)localStorage.setItem(\"theme\",n);else localStorage.removeItem(\"theme\");}s=n;}}catch(e){}s=s||\"dark\";if(s){document.documentElement.setAttribute(\"data-theme\",s);var m=document.querySelector('meta[name=\"color-scheme\"]');if(m)m.setAttribute(\"content\",s);}})();document.documentElement.setAttribute(\"data-astryx-theme\",\"arda\");" },
  # Vendored under public/vendor/ (marked 18.0.5, DOMPurify 3.4.8) — pinned and
  # served same-origin, so there is no CDN supply-chain/availability risk and
  # no need for SRI (which Lustre's html config can't express on scripts anyway).
  { src = "/vendor/marked.min.js" },
  { src = "/vendor/purify.min.js" },
  # The scheme switch after load (ffi.mjs: scheme_toggle, scheme_watch). A
  # module script runs before the app's own, which follows it in <head>.
  { type = "module", content = "import * as scheme from '/brand/scheme.js?v=1';window.ardaScheme=scheme;" },
  # The wisp moves: the family's smoke.js plays its film over the image. The
  # app draws the wisp after this runs, so wait for it (a few seconds at most).
  { type = "module", content = "import{startSmoke}from'/brand/smoke.js?v=1';let n=0;const go=()=>{if(document.querySelector('.ix-smoke>img[data-smoke-video]'))startSmoke();else if(++n<600)requestAnimationFrame(go)};go();" },
]
# The CF Web Analytics beacon lives in `body` (raw HTML) because Lustre's
# `scripts` config can't express the required data-cf-beacon attribute.
# The JSON-LD (the site, and the Person that arda.tr defines for the whole
# family) ends `body` too, which the build copies into index.html verbatim.
body = "<div id=\"app\"></div><noscript><p>This chat needs JavaScript. Arda's site is at <a href=\"https://arda.tr\">arda.tr</a>, his résumé at <a href=\"https://resume.arda.tr\">resume.arda.tr</a> and his blog at <a href=\"https://blog.arda.tr\">blog.arda.tr</a>.</p></noscript><!-- Cloudflare Web Analytics --><script defer src=\"https://static.cloudflareinsights.com/beacon.min.js\" data-cf-beacon='{\"token\": \"ec0a808ebf6b4be7b59a63377cbeff3a\"}'></script><!-- End Cloudflare Web Analytics --><script type=\"application/ld+json\">{\"@context\":\"https://schema.org\",\"@type\":\"WebSite\",\"@id\":\"https://ai.arda.tr/#website\",\"url\":\"https://ai.arda.tr/\",\"name\":\"Arda's AI Construct\",\"inLanguage\":[\"en\",\"ja\",\"tr\"],\"about\":{\"@type\":\"Person\",\"@id\":\"https://arda.tr/#person\",\"name\":\"Arda Karaduman\",\"url\":\"https://arda.tr/\"},\"author\":{\"@id\":\"https://arda.tr/#person\"}}</script>"
