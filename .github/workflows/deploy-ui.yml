name: Deploy UI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Opt JavaScript actions into Node 24 ahead of GitHub's June 2026 default
# (keeps the SHA pins below; just changes the runtime).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install the Erlang + Gleam toolchain to build the Lustre frontend.
      - name: Setup Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.4.1"
          gleam-version: "1.15.2"
          rebar3-version: "3"

      # lustre_dev_tools downloads Bun in a single attempt; retry the build.
      - name: Build Lustre frontend
        working-directory: frontend
        run: |
          gleam deps download
          for attempt in 1 2 3; do
            gleam run -m lustre/dev build --minify --outdir=../public && exit 0
            echo "::warning::Lustre build failed (attempt $attempt of 3)"
            rm -rf .lustre
            sleep 10
          done
          exit 1

      - name: Set up Node for browser-boundary tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test streaming client
        working-directory: frontend
        run: gleam build && node --test test/*.test.mjs

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
