name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Opt JavaScript actions into Node 24 ahead of GitHub's June 2026 default
# (keeps the SHA pins below; just changes the runtime).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend:
    name: Backend (format, build, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Erlang/OTP + Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.4.1"
          gleam-version: "1.15.2"
          rebar3-version: "3"

      - name: Check formatting
        run: gleam format --check src test shared/src

      - name: Download dependencies
        run: gleam deps download

      - name: Build
        run: gleam build

      - name: Test
        run: gleam test

  frontend:
    name: Frontend (format, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Erlang/OTP + Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.4.1"
          gleam-version: "1.15.2"
          rebar3-version: "3"

      - name: Check formatting
        working-directory: frontend
        run: gleam format --check src

      - name: Download dependencies
        working-directory: frontend
        run: gleam deps download

      - name: Set up Node for browser-boundary tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test streaming client
        working-directory: frontend
        run: gleam build && node --test test/*.test.mjs

      # lustre_dev_tools downloads Bun in a single attempt; retry the build.
      - name: Build Lustre bundle
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            gleam run -m lustre/dev build --minify --outdir=../public && exit 0
            echo "::warning::Lustre build failed (attempt $attempt of 3)"
            rm -rf .lustre
            sleep 10
          done
          exit 1
