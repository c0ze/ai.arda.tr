name: Deploy Backend to Cloud Run

# Auto-deploys on push to main when backend-relevant files change. Frontend /
# docs-only changes do not trigger a backend redeploy (the frontend ships to
# GitHub Pages via deploy-ui.yml). Manual runs are still available.
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'shared/src/**'
      - 'shared/gleam.toml'
      - 'shared/manifest.toml'
      - 'gleam.toml'
      - 'manifest.toml'
      - 'personal.md'
      - 'job_requirements.md'
      - '.github/workflows/deploy-backend.yml'
  # The bot bakes the résumé in at build time, so it needs redeploying when the
  # résumé changes in c0ze/resume. That used to be a repository_dispatch fired
  # from that repo, authenticated with a fine-grained PAT — which expired after
  # 30 days and then failed silently for six weeks while the bot answered
  # visitors from a stale résumé. GitHub's own API does not accept Actions OIDC
  # tokens (those federate to external providers, which is what the WIF auth
  # below uses for GCP), so that hop always needed a bearer credential of some
  # kind. A schedule needs none, so the credential is gone entirely.
  #
  # 03:17 UTC is 12:17 JST: off the top of the hour, which is when GitHub's
  # scheduler is busiest (runs at :00 have started 5-8 hours late). Scheduled
  # runs can still start late, so staleness is bounded at roughly a day; for an
  # immediate refresh after editing the résumé, run this workflow manually:
  #   gh workflow run deploy-backend.yml --repo c0ze/ai.arda.tr
  # GitHub disables schedules in public repos after 60 days without repository
  # activity; the keepalive job below re-enables this workflow on every
  # scheduled run, which resets that clock.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Each job asks for exactly what it needs.
permissions: {}

# Serialize backend deploys: merging PRs back-to-back would otherwise spawn
# concurrent `gcloud run deploy` runs that race, and with build caching an
# older commit's run can finish last and serve a stale image. cancel-in-progress
# means the newest commit wins (mirrors deploy-ui.yml's Pages concurrency).
concurrency:
  group: deploy-backend
  cancel-in-progress: true

# Opt JavaScript actions into Node 24 ahead of GitHub's June 2026 default
# (keeps the SHA pins below; just changes the runtime).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Keeps the daily schedule alive: GitHub would otherwise disable it after 60
  # days without commits, and the résumé would silently go stale again. Uses
  # only the run's own GITHUB_TOKEN.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow (resets the inactivity clock)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy-backend.yml/enable"

  # Same checks as ci.yml's backend job: a commit that fails them never
  # reaches Cloud Run (ci.yml runs in parallel and cannot gate this).
  test:
    name: Backend (format, build, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Erlang/OTP + Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.4.1"
          gleam-version: "1.15.2"
          rebar3-version: "3"

      - name: Check formatting
        run: gleam format --check src test shared/src

      - name: Download dependencies
        run: gleam deps download

      - name: Build
        run: gleam build

      - name: Test
        run: gleam test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keyless auth via Workload Identity Federation — no JSON keys in GitHub.
      # Required secrets: GCP_WIF_PROVIDER (full provider resource name),
      # GCP_SA_EMAIL. Create them once with scripts/setup-gcp-wif.sh.
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: '${{ secrets.GCP_WIF_PROVIDER }}'
          service_account: '${{ secrets.GCP_SA_EMAIL }}'

      # Build the image from the repo-root Dockerfile (via Cloud Build) and
      # deploy. Required secrets: GEMINI_API_KEY, ALLOWED_ORIGINS.
      # Optional: GMAIL_USER, GMAIL_APP_PASSWORD, CONTACT_ADDRESS.
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: 'ai-arda-tr-api'
          region: 'asia-northeast1'
          source: '.'
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            GMAIL_USER=${{ secrets.GMAIL_USER }}
            GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
            CONTACT_ADDRESS=${{ secrets.CONTACT_ADDRESS }}
          flags: '--allow-unauthenticated'
